version: "3.9"

services:
  bifrost:
    image: maximhq/bifrost:latest
    container_name: bifrost
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - bifrost_data:/data
    environment:
      BIFROST_HOST: 0.0.0.0
      BIFROST_PORT: 8080
      BIFROST_SETUP_TOKEN: ${BIFROST_SETUP_TOKEN:?Set BIFROST_SETUP_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  bifrost_data:
